---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ansible-operator-cilium
    app.kubernetes.io/managed-by: kustomize
  name: cilium-editor-role
rules:
  - apiGroups:
      - alvistack
    resources:
      - cilia
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - alvistack
    resources:
      - cilia/status
    verbs:
      - get
