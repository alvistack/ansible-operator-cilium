---
namespace: osdk-test
namePrefix: osdk-
patches:
  - path: manager_image.yaml
  - path: debug_logs_patch.yaml
  - path: ../default/manager_metrics_patch.yaml
    target:
      kind: Deployment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../crd
  - ../rbac
  - ../manager
images:
  - name: testing
    newName: testing-operator
